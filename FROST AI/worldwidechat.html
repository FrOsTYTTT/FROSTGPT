<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="Chat with the FROSTGPT community in Worldwide Chat.">
<title>Worldwide Chat · FROSTGPT™</title><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#10131b;--surface:#191e2a;--surface2:#222a39;--text:#f4f6fb;--muted:#a7b0c0;--line:#30394a;--accent:#4f8cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.page{width:min(920px,100%);min-height:100vh;margin:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:750}.brand img{width:34px;height:34px}.back{color:var(--muted);text-decoration:none;font-size:13px}
h1{margin:0;font-size:clamp(23px,4vw,30px)}.intro{margin:3px 0 0;color:var(--muted);font-size:13px}#status{color:var(--muted);font-size:12px}
#messages{display:flex;flex:1;min-height:240px;max-height:calc(100vh - 290px);overflow:auto;flex-direction:column;gap:11px;padding:2px}
.message{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.meta strong{color:var(--text);font-size:13px}
.message p{margin:9px 0;white-space:pre-wrap}.reply-reference{margin:8px 0;padding:8px 10px;border-left:3px solid var(--accent);border-radius:5px;background:var(--surface2);color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px}button{font:inherit;cursor:pointer}.actions button,.cancel{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:12px}
.composer{display:grid;gap:9px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}#replyPreview{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}#replyPreview[hidden]{display:none}
textarea{width:100%;min-height:74px;resize:vertical;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}#send{padding:9px 18px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:700}#send:disabled{opacity:.5;cursor:wait}
#signInNotice{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}#signInNotice a{color:#8bb4ff}
@media(max-width:560px){.page{padding:14px 11px}header{align-items:flex-start}.meta{flex-direction:column;gap:2px}#messages{max-height:calc(100vh - 320px)}.composer-foot{align-items:flex-start}}
</style></head>
<body><main class="page">
<header><a class="brand" href="/" aria-label="FROSTGPT home"><img src="/icon.svg" alt=""><span>FROSTGPT™</span></a><a class="back" href="/">← Back to FROSTGPT</a></header>
<section><h1>🌎 Worldwide Chat</h1><p class="intro">Talk with the FROSTGPT community. Be respectful and keep personal information private.</p></section>
<div id="status" role="status" aria-live="polite">Connecting…</div>
<div id="signInNotice" hidden>Sign in to FROSTGPT first, then return here. <a href="/">Go to sign in</a></div>
<section id="messages" aria-live="polite" aria-label="Worldwide messages"></section>
<form id="composer" class="composer">
<div id="replyPreview" hidden><span id="replyText"></span><button class="cancel" id="cancelReply" type="button">Cancel</button></div>
<textarea id="messageInput" maxlength="500" placeholder="Write a message to everyone…" aria-label="Worldwide Chat message"></textarea>
<div class="composer-foot"><span>500 characters max · Don't share personal information.</span><button id="send" type="submit">Send</button></div>
</form></main><script type="module" src="/worldwidechat.js"></script></body></html>
